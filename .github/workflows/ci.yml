name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go mod verify
      - run: go test -race -cover ./...
      - run: go vet ./...
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go build ./cmd/atlo
